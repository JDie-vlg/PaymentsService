services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payments-network

  candidate-service:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payments_db
      PROVIDER_URL: http://provider-simulator:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - candidate-data:/data
    networks:
      - payments-network

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    depends_on:
      - candidate-service
    networks:
      - payments-network

volumes:
  postgres_data:
  candidate-data:

networks:
  payments-network:
    driver: bridge